name: Smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/ml_researcher_os/cli.py list-skills
      - run: python src/ml_researcher_os/cli.py extract-claims examples/tiny-paper-replication/paper.md
      - run: python src/ml_researcher_os/cli.py audit
      - run: python src/ml_researcher_os/cli.py improve --output feedback/IMPROVEMENT_BACKLOG.md --json-output feedback/improvement-report.json
      - run: python -m unittest discover -s tests
