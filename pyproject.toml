[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-researcher-os"
version = "0.1.0"
description = "Agent skills and workflows for reproducible ML research."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "maximussthegreat" }
]
keywords = [
  "agent-skills",
  "machine-learning",
  "reproducibility",
  "research-agents"
]
dependencies = []

[project.scripts]
mlro = "ml_researcher_os.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

